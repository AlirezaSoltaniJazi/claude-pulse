version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '03:00'
      timezone: 'Europe/London'
    open-pull-requests-limit: 10
    labels:
      - 'dependencies'
      - 'security'
    ignore:
      # Must be raised deliberately and in lockstep with engines.vscode.
      # vsce throws at package time when @types/vscode exceeds engines.vscode,
      # and nothing in CI runs `vsce package`, so an automated bump here
      # silently breaks `npm run release`.
      - dependency-name: '@types/vscode'
